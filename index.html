<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Успеваемость 10 класс — Лёха</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --asphalt-0: #171a22;
    --asphalt-1: #1f232e;
    --asphalt-2: #2a2f3d;
    --asphalt-3: #353b4d;
    --line: rgba(150, 170, 220, 0.12);
    --line-hi: rgba(120, 200, 255, 0.45);
    --text: #d4dae8;
    --text-dim: #8891a8;
    --text-hi: #f2f5fc;
    --neon: #5eead4;
    --neon-2: #38bdf8;
    --neon-warn: #fbbf24;
    --neon-danger: #f87171;
    --neon-good: #4ade80;
    --grid: rgba(90, 200, 255, 0.05);
  }

  body {
    font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    min-height: 100vh;
    background: var(--asphalt-0);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.1), transparent 55%);
    background-size: 42px 42px, 42px 42px, 100% 100%;
    color: var(--text);
    padding: 18px;
    overflow-x: hidden;
    position: relative;
    line-height: 1.5;
  }

  /* ===== 3D ФОН ===== */
  .bg-3d {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
    perspective: 900px;
  }
  .cube {
    position: absolute;
    width: 52px;
    height: 52px;
    transform-style: preserve-3d;
    animation: rotate 22s infinite linear;
    opacity: 0.3;
  }
  .cube .face {
    position: absolute;
    width: 52px;
    height: 52px;
    border: 1px solid rgba(94, 234, 212, 0.45);
    background: rgba(94, 234, 212, 0.03);
  }
  .cube .f1 { transform: translateZ(26px); }
  .cube .f2 { transform: rotateY(180deg) translateZ(26px); }
  .cube .f3 { transform: rotateY(90deg) translateZ(26px); }
  .cube .f4 { transform: rotateY(-90deg) translateZ(26px); }
  .cube .f5 { transform: rotateX(90deg) translateZ(26px); }
  .cube .f6 { transform: rotateX(-90deg) translateZ(26px); }

  @keyframes rotate {
    from { transform: rotateX(0) rotateY(0); }
    to   { transform: rotateX(360deg) rotateY(360deg); }
  }

  .sphere {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(94, 234, 212, 0.4), rgba(56, 189, 248, 0.08) 70%);
    opacity: 0.4;
    animation: float 14s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-24px) scale(1.05); }
  }

  /* ===== КОНТЕЙНЕР ===== */
  .container {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  /* ===== ШАПКА ===== */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .flag {
    width: 42px;
    height: 30px;
    background: repeating-conic-gradient(#fff 0% 25%, #171a22 0% 50%) 0 0 / 14px 14px;
    border-radius: 4px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(94, 234, 212, 0.3);
  }
  .header-text h1 {
    font-size: 22px;
    color: var(--text-hi);
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .header-text p {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ===== ВЕРХНЯЯ СВОДКА ===== */
  .top-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat-card {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--neon);
    opacity: 0.7;
  }
  .stat-card:hover { border-color: var(--line-hi); transform: translateY(-2px); }
  .stat-card .num {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-hi);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .lbl {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .stat-card.s5::before { background: var(--neon-good); }
  .stat-card.s5 .num { color: var(--neon-good); }
  .stat-card.s4::before { background: var(--neon-2); }
  .stat-card.s4 .num { color: var(--neon-2); }
  .stat-card.s3::before { background: var(--neon-warn); }
  .stat-card.s3 .num { color: var(--neon-warn); }
  .stat-card.s2::before { background: var(--neon-danger); }
  .stat-card.s2 .num { color: var(--neon-danger); }

  /* ===== ТРЕВОЖНАЯ ПЛАШКА ===== */
  .alert-bar {
    border-radius: 10px;
    padding: 12px 18px;
    margin-bottom: 16px;
    font-size: 14px;
    text-align: center;
    display: none;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .alert-bar.show { display: block; }
  .alert-bar.warn {
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.55);
    color: var(--neon-danger);
  }
  .alert-bar.danger {
    background: rgba(248, 113, 113, 0.16);
    border: 1px solid rgba(248, 113, 113, 0.7);
    color: var(--neon-danger);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  /* ===== ПАНЕЛЬ ЦЕЛЕЙ ===== */
  .targets-panel {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
    position: relative;
  }
  .targets-panel h2 {
    font-size: 13px;
    color: var(--neon);
    margin-bottom: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .targets-panel h2::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line-hi), transparent);
  }
  .targets-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 8px;
  }
  .target-item {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--neon);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  .target-item:hover {
    background: var(--asphalt-3);
    border-left-color: var(--neon-2);
  }
  .target-item .tname { color: var(--text); flex: 1; font-weight: 500; }

  .tbadge {
    display: inline-block;
    border-radius: 6px;
    padding: 3px 9px;
    font-weight: 700;
    font-size: 11.5px;
    white-space: nowrap;
    border: 1px solid;
  }
  .tbadge.to5 {
    background: rgba(74, 222, 128, 0.12);
    color: var(--neon-good);
    border-color: rgba(74, 222, 128, 0.45);
  }
  .tbadge.to4 {
    background: rgba(56, 189, 248, 0.12);
    color: var(--neon-2);
    border-color: rgba(56, 189, 248, 0.45);
  }
  .tbadge.done {
    background: rgba(74, 222, 128, 0.18);
    color: var(--neon-good);
    border-color: rgba(74, 222, 128, 0.6);
  }
  .tbadge.empty {
    background: rgba(120, 130, 160, 0.1);
    color: var(--text-dim);
    border-color: var(--line);
  }

  /* ===== ПРЕДМЕТЫ ===== */
  .subject {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px 17px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }
  .subject::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--neon);
    opacity: 0.5;
  }
  .subject:hover {
    border-color: var(--line-hi);
    transform: translateX(2px);
  }

  .subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 11px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .subject-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-hi);
    flex: 1;
  }
  .avg {
    font-size: 16px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 8px;
    min-width: 58px;
    text-align: center;
    background: var(--asphalt-2);
    border: 1px solid var(--line-hi);
    color: var(--text-hi);
    font-variant-numeric: tabular-nums;
  }
  .avg.green { color: var(--neon-good); border-color: rgba(74, 222, 128, 0.55); box-shadow: 0 0 10px rgba(74,222,128,0.15); }
  .avg.yellow { color: var(--neon-2); border-color: rgba(56, 189, 248, 0.55); box-shadow: 0 0 10px rgba(56,189,248,0.15); }
  .avg.red { color: var(--neon-warn); border-color: rgba(251, 191, 36, 0.55); box-shadow: 0 0 10px rgba(251,191,36,0.15); }
  .avg.gray { color: var(--text-dim); }

  .grades {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 11px;
    min-height: 34px;
    align-items: center;
  }
  .grade {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
    user-select: none;
    background: var(--asphalt-2);
    border: 1px solid var(--line-hi);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .grade:hover {
    transform: translateY(-2px) scale(1.05);
    background: var(--asphalt-3);
  }
  .grade:active { transform: scale(0.94); }
  .grade.g5 { color: var(--neon-good); border-color: rgba(74, 222, 128, 0.5); }
  .grade.g5:hover { background: rgba(74, 222, 128, 0.15); }
  .grade.g4 { color: var(--neon-2); border-color: rgba(56, 189, 248, 0.5); }
  .grade.g4:hover { background: rgba(56, 189, 248, 0.15); }
  .grade.g3 { color: var(--neon-warn); border-color: rgba(251, 191, 36, 0.5); }
  .grade.g3:hover { background: rgba(251, 191, 36, 0.15); }
  .grade.g2 { color: var(--neon-danger); border-color: rgba(248, 113, 113, 0.55); }
  .grade.g2:hover { background: rgba(248, 113, 113, 0.18); }

  .empty { color: var(--text-dim); font-size: 12.5px; font-style: italic; }

  .controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls button {
    border: 1px solid var(--line-hi);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, color 0.15s;
    background: var(--asphalt-2);
    color: var(--text);
  }
  .controls button:hover {
    background: var(--asphalt-3);
    transform: translateY(-1px);
  }
  .controls button:active { transform: translateY(0); }
  .btn5:hover { color: var(--neon-good); border-color: rgba(74, 222, 128, 0.7); }
  .btn4:hover { color: var(--neon-2); border-color: rgba(56, 189, 248, 0.7); }
  .btn3:hover { color: var(--neon-warn); border-color: rgba(251, 191, 36, 0.7); }
  .btn2:hover { color: var(--neon-danger); border-color: rgba(248, 113, 113, 0.7); }

  .status {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 7px;
    margin-left: auto;
    white-space: nowrap;
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    letter-spacing: 0.2px;
  }
  .status.ok { color: var(--neon-good); border-color: rgba(74, 222, 128, 0.5); }
  .status.near { color: var(--neon-2); border-color: rgba(56, 189, 248, 0.5); }
  .status.no { color: var(--neon-warn); border-color: rgba(251, 191, 36, 0.5); }

  .summary {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-top: 18px;
  }
  .summary h2 {
    font-size: 13px;
    margin-bottom: 10px;
    color: var(--neon);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.3px;
  }
  .summary p { margin: 5px 0; font-size: 14px; color: var(--text); }

  .reset {
    display: block;
    margin: 16px auto 0;
    background: transparent;
    color: var(--neon-danger);
    border: 1px solid rgba(248, 113, 113, 0.5);
    border-radius: 8px;
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .reset:hover {
    background: rgba(248, 113, 113, 0.12);
    border-color: rgba(248, 113, 113, 0.85);
    box-shadow: 0 0 16px rgba(248, 113, 113, 0.25);
  }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 14px;
    letter-spacing: 0.3px;
  }

  /* ===== 3D ДОМИК ===== */
  .house-section {
    margin-top: 40px;
    padding: 30px 0 20px;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .house-title {
    font-size: 14px;
    color: var(--neon);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .house-stage {
    width: 100%;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    user-select: none;
  }
  .house {
    width: 180px;
    height: 180px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-15deg) rotateY(-25deg);
    transition: transform 0.05s linear;
    cursor: grab;
    filter: drop-shadow(0 20px 30px rgba(94, 234, 212, 0.15));
  }
  .house:active { cursor: grabbing; }

  .wall {
    position: absolute;
    width: 180px;
    height: 130px;
    background: linear-gradient(180deg, #2a3040 0%, #1f2431 100%);
    border: 1.5px solid rgba(94, 234, 212, 0.35);
    bottom: 0;
    box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.08);
  }
  .wall-front  { transform: translateZ(90px); }
  .wall-back   { transform: rotateY(180deg) translateZ(90px); }
  .wall-left   { transform: rotateY(-90deg) translateZ(90px); }
  .wall-right  { transform: rotateY(90deg) translateZ(90px); }

  .floor {
    position: absolute;
    width: 180px;
    height: 180px;
    background: linear-gradient(135deg, #1a1f2b 0%, #151923 100%);
    border: 1.5px solid rgba(94, 234, 212, 0.25);
    transform: rotateX(90deg) translateZ(-25px);
    top: 0;
    left: 0;
  }

  .door {
    position: absolute;
    width: 36px;
    height: 62px;
    background: linear-gradient(180deg, #3a4663 0%, #2a3348 100%);
    border: 1.5px solid rgba(94, 234, 212, 0.55);
    border-radius: 3px 3px 0 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(94, 234, 212, 0.2);
  }
  .door::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--neon);
    border-radius: 50%;
    right: 5px;
    top: 50%;
    box-shadow: 0 0 6px var(--neon);
  }

  .window {
    position: absolute;
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, rgba(94, 234, 212, 0.35), rgba(56, 189, 248, 0.25));
    border: 1.5px solid rgba(94, 234, 212, 0.7);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(94, 234, 212, 0.35);
  }
  .window::before,
  .window::after {
    content: '';
    position: absolute;
    background: rgba(94, 234, 212, 0.7);
  }
  .window::before { left: 50%; top: 0; bottom: 0; width: 1.5px; transform: translateX(-50%); }
  .window::after { top: 50%; left: 0; right: 0; height: 1.5px; transform: translateY(-50%); }
  .window-left  { top: 22px; left: 20px; }
  .window-right { top: 22px; right: 20px; }
  .window-back  { top: 22px; left: 50%; transform: translateX(-50%); }
  .window-side  { top: 22px; left: 50%; transform: translateX(-50%); }

  .roof {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 95px solid transparent;
    border-right: 95px solid transparent;
    border-bottom: 90px solid #2a3348;
    top: -90px;
    left: 50%;
    transform-origin: center bottom;
  }
  .roof-front {
    transform: translateX(-50%) translateZ(90px) rotateX(-35deg);
    border-bottom-color: rgba(94, 234, 212, 0.35);
    filter: drop-shadow(0 0 8px rgba(94, 234, 212, 0.3));
  }
  .roof-back {
    transform: translateX(-50%) rotateY(180deg) translateZ(90px) rotateX(-35deg);
    border-bottom-color: rgba(94, 234, 212, 0.2);
  }
  .roof-left {
    transform: translateX(-50%) rotateY(-90deg) translateZ(90px) rotateX(-35deg);
    border-bottom-color: rgba(94, 234, 212, 0.25);
  }
  .roof-right {
    transform: translateX(-50%) rotateY(90deg) translateZ(90px) rotateX(-35deg);
    border-bottom-color: rgba(94, 234, 212, 0.25);
  }

  .gable {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 90px solid transparent;
    border-right: 90px solid transparent;
    border-bottom: 65px solid #1f2431;
    top: -65px;
    left: 50%;
  }
  .gable-front { transform: translateX(-50%) translateZ(89px); }
  .gable-back  { transform: translateX(-50%) rotateY(180deg) translateZ(89px); }

  .chimney {
    position: absolute;
    width: 22px;
    height: 50px;
    background: linear-gradient(180deg, #3a4663 0%, #2a3348 100%);
    border: 1.5px solid rgba(94, 234, 212, 0.5);
    top: -155px;
    right: 25px;
    transform: translateZ(40px);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(94, 234, 212, 0.2);
  }
  .chimney-top {
    position: absolute;
    width: 30px;
    height: 8px;
    background: linear-gradient(180deg, #4a5678 0%, #3a4663 100%);
    border: 1.5px solid rgba(94, 234, 212, 0.6);
    top: -8px;
    left: -6px;
    border-radius: 2px;
  }

  .house-hint {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 620px) {
    body { padding: 12px; }
    .header-text h1 { font-size: 17px; }
    .top-stats { grid-template-columns: repeat(2, 1fr); }
    .stat-card .num { font-size: 22px; }
    .subject { padding: 13px 14px; }
    .grade { width: 32px; height: 32px; font-size: 13px; }
    .targets-list { grid-template-columns: 1fr; }
    .target-item { font-size: 12.5px; }
    .tbadge { font-size: 11px; padding: 3px 8px; }

    .house-stage { height: 260px; }
    .house {
      width: 130px;
      height: 130px;
      transform: rotateX(-15deg) rotateY(-25deg) scale(0.85);
    }
    .wall { width: 130px; height: 95px; }
    .wall-front  { transform: translateZ(65px); }
    .wall-back   { transform: rotateY(180deg) translateZ(65px); }
    .wall-left   { transform: rotateY(-90deg) translateZ(65px); }
    .wall-right  { transform: rotateY(90deg) translateZ(65px); }
    .floor {
      width: 130px; height: 130px;
      transform: rotateX(90deg) translateZ(-18px);
    }
    .door { width: 28px; height: 46px; }
    .window { width: 22px; height: 22px; }
    .window-left  { top: 16px; left: 14px; }
    .window-right { top: 16px; right: 14px; }
    .window-back  { top: 16px; }
    .window-side  { top: 16px; }
    .roof {
      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 65px solid #2a3348;
      top: -65px;
    }
    .roof-front { transform: translateX(-50%) translateZ(65px) rotateX(-35deg); }
    .roof-back  { transform: translateX(-50%) rotateY(180deg) translateZ(65px) rotateX(-35deg); }
    .roof-left  { transform: translateX(-50%) rotateY(-90deg) translateZ(65px) rotateX(-35deg); }
    .roof-right { transform: translateX(-50%) rotateY(90deg) translateZ(65px) rotateX(-35deg); }
    .gable {
      border-left: 65px solid transparent;
      border-right: 65px solid transparent;
      border-bottom: 48px solid #1f2431;
      top: -48px;
    }
    .gable-front { transform: translateX(-50%) translateZ(64px); }
    .gable-back  { transform: translateX(-50%) rotateY(180deg) translateZ(64px); }
    .chimney { width: 16px; height: 36px; top: -110px; right: 18px; transform: translateZ(28px); }
    .chimney-top { width: 22px; height: 6px; left: -4px; top: -6px; }
  }
</style>
</head>
<body>

<!-- ===== 3D ФОН ===== -->
<div class="bg-3d">
  <div class="cube" style="top:10%; left:5%; animation-duration:22s;">
    <div class="face f1"></div><div class="face f2"></div>
    <div class="face f3"></div><div class="face f4"></div>
    <div class="face f5"></div><div class="face f6"></div>
  </div>
  <div class="cube" style="top:72%; left:90%; animation-duration:26s;">
    <div class="face f1"></div><div class="face f2"></div>
    <div class="face f3"></div><div class="face f4"></div>
    <div class="face f5"></div><div class="face f6"></div>
  </div>
  <div class="sphere" style="width:150px;height:150px;top:18%;left:82%;"></div>
  <div class="sphere" style="width:100px;height:100px;top:78%;left:8%;animation-delay:3s;"></div>
  <div class="sphere" style="width:70px;height:70px;top:45%;left:3%;animation-delay:6s;"></div>
</div>

<!-- ===== КОНТЕНТ ===== -->
<div class="container">
  <div class="header">
    <div class="flag"></div>
    <div class="header-text">
      <h1>Успеваемость 10 класс</h1>
      <p id="headerSub">Цель: средний &gt; 4.6 — пятёрка в четверти</p>
    </div>
  </div>

  <div class="top-stats">
    <div class="stat-card s5">
      <div class="num" id="top5">0</div>
      <div class="lbl">На 5</div>
    </div>
    <div class="stat-card s4">
      <div class="num" id="top4">0</div>
      <div class="lbl">На 4</div>
    </div>
    <div class="stat-card s3">
      <div class="num" id="top3">0</div>
      <div class="lbl">На 3</div>
    </div>
    <div class="stat-card s2">
      <div class="num" id="top2">0</div>
      <div class="lbl">На 2 / нет</div>
    </div>
  </div>

  <div class="alert-bar" id="alertBar"></div>

  <div class="targets-panel">
    <h2>🎯 Что нужно получить</h2>
    <div class="targets-list" id="targetsList"></div>
  </div>

  <div id="subjects"></div>

  <div class="summary">
    <h2>📊 Полная сводка</h2>
    <p id="stat5"></p>
    <p id="stat4"></p>
    <p id="stat3"></p>
    <p id="statEmpty"></p>
    <p id="statTotal"></p>
    <button class="reset" onclick="resetAll()">🔄 Сбросить всё</button>
  </div>

  <p class="hint">💡 Клик по оценке — удалить (с подтверждением). Кнопки +5/+4/+3/+2 — добавить.</p>
</div>

<!-- ===== 3D ДОМИК ===== -->
<div class="house-section">
  <h2 class="house-title">🏠 Крути домик</h2>
  <div class="house-stage" id="houseStage">
    <div class="house" id="house3d">
      <div class="roof roof-front"></div>
      <div class="roof roof-back"></div>
      <div class="roof roof-left"></div>
      <div class="roof roof-right"></div>

      <div class="gable gable-front"></div>
      <div class="gable gable-back"></div>

      <div class="wall wall-front">
        <div class="door"></div>
        <div class="window window-left"></div>
        <div class="window window-right"></div>
      </div>
      <div class="wall wall-back">
        <div class="window window-back"></div>
      </div>
      <div class="wall wall-left">
        <div class="window window-side"></div>
      </div>
      <div class="wall wall-right">
        <div class="window window-side"></div>
      </div>

      <div class="floor"></div>

      <div class="chimney">
        <div class="chimney-top"></div>
      </div>
    </div>
  </div>
  <p class="house-hint">Зажми и крути 🖱️</p>
</div>
<script>
// ===== НАСТРОЙКИ =====
const TARGET_5 = 4.6;
const TARGET_4 = 3.6;

// ===== ПРЕДМЕТЫ =====
let subjects = [
  { name: "Алгебра и начала анализа", grades: [5,5,5,4,3,3] },
  { name: "Биология", grades: [5] },
  { name: "Вероятность и статистика", grades: [5,3,4] },
  { name: "География", grades: [] },
  { name: "Геометрия", grades: [3,3,3,3,3,3] },
  { name: "Индивидуальный проект", grades: [] },
  { name: "Иностранный (английский) язык", grades: [5,4,4] },
  { name: "Информатика", grades: [4,4] },
  { name: "История", grades: [3] },
  { name: "Литература", grades: [4] },
  { name: "Математика", grades: [] },
  { name: "Обществознание", grades: [4] },
  { name: "ОБЗР", grades: [5,5,5] },
  { name: "Русский язык", grades: [3,3,3,3] },
  { name: "Физика", grades: [3,5,3,3,4] },
  { name: "Физическая культура", grades: [5] },
  { name: "Химия", grades: [] },
  { name: "Черчение и перспектива", grades: [] }
];

// ===== ПАМЯТЬ =====
function save() { localStorage.setItem('grades10_lyoha', JSON.stringify(subjects)); }
function load() {
  const saved = localStorage.getItem('grades10_lyoha');
  if (saved) { try { subjects = JSON.parse(saved); } catch(e) {} }
}

// ===== СРЕДНИЙ БАЛЛ =====
function avg(g) {
  if (g.length === 0) return 0;
  return g.reduce((a,b)=>a+b,0) / g.length;
}
function avgClass(a) {
  if (a === 0) return 'gray';
  if (a > TARGET_5) return 'green';
  if (a >= TARGET_4) return 'yellow';
  return 'red';
}

// ===== СКОЛЬКО ПЯТЁРОК НУЖНО =====
function needGrades(grades, target) {
  if (grades.length === 0) return null;
  let sum = grades.reduce((a,b)=>a+b,0);
  let count = grades.length;
  if (sum / count > target) return 0;
  let n = 0;
  while ((sum + 5*n) / (count + n) <= target && n < 1000) n++;
  return n;
}

// ===== СТАТУС ПРЕДМЕТА =====
function getSubjectStatus(subj) {
  if (subj.grades.length === 0) return 'empty';
  const a = avg(subj.grades);
  if (a > TARGET_5) return 'five';
  if (a >= TARGET_4) return 'four';
  if (a >= 2.5) return 'three';
  return 'two';
}

// ===== СКЛОНЕНИЕ =====
function plural(n) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'предмет';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'предмета';
  return 'предметов';
}

// ===== ОТРИСОВКА ПРЕДМЕТОВ =====
function render() {
  const container = document.getElementById('subjects');
  container.innerHTML = '';

  subjects.forEach((subj) => {
    const a = avg(subj.grades);
    const div = document.createElement('div');
    div.className = 'subject';

    const header = document.createElement('div');
    header.className = 'subject-header';
    const name = document.createElement('div');
    name.className = 'subject-name';
    name.textContent = subj.name;
    header.appendChild(name);
    const avgEl = document.createElement('div');
    avgEl.className = 'avg ' + avgClass(a);
    avgEl.textContent = a.toFixed(2);
    header.appendChild(avgEl);
    div.appendChild(header);

    const gradesDiv = document.createElement('div');
    gradesDiv.className = 'grades';
    if (subj.grades.length === 0) {
      const em = document.createElement('span');
      em.className = 'empty';
      em.textContent = 'нет оценок';
      gradesDiv.appendChild(em);
    } else {
      subj.grades.forEach((g, gi) => {
        const gEl = document.createElement('div');
        gEl.className = 'grade g' + g;
        gEl.textContent = g;
        gEl.title = 'Клик — удалить';
        gEl.onclick = () => {
          if (confirm('Удалить оценку ' + g + ' по предмету "' + subj.name + '"?')) {
            subj.grades.splice(gi, 1);
            save(); render();
          }
        };
        gradesDiv.appendChild(gEl);
      });
    }
    div.appendChild(gradesDiv);

    const controls = document.createElement('div');
    controls.className = 'controls';
    [5,4,3,2].forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'btn' + g;
      btn.textContent = '+' + g;
      btn.onclick = () => {
        subj.grades.push(g);
        save(); render();
      };
      controls.appendChild(btn);
    });

    const status = document.createElement('div');
    if (subj.grades.length === 0) {
      status.className = 'status';
      status.textContent = 'нет данных';
    } else if (a > TARGET_5) {
      status.className = 'status ok';
      status.textContent = '✅ 5';
    } else if (a >= TARGET_4) {
      const need5 = needGrades(subj.grades, TARGET_5);
      status.className = 'status near';
      status.textContent = 'нужно ' + need5 + ' п. → 5';
    } else {
      const need4 = needGrades(subj.grades, TARGET_4);
      status.className = 'status no';
      status.textContent = 'нужно ' + need4 + ' п. → 4';
    }
    controls.appendChild(status);
    div.appendChild(controls);
    container.appendChild(div);
  });

  renderTargets();
  updateSummary();
}

// ===== ПАНЕЛЬ ЦЕЛЕЙ =====
function renderTargets() {
  const list = document.getElementById('targetsList');
  list.innerHTML = '';
  subjects.forEach(subj => {
    const item = document.createElement('div');
    item.className = 'target-item';

    const name = document.createElement('span');
    name.className = 'tname';
    name.textContent = subj.name;
    item.appendChild(name);

    const badge = document.createElement('span');
    if (subj.grades.length === 0) {
      badge.className = 'tbadge empty';
      badge.textContent = '—';
    } else {
      const a = avg(subj.grades);
      if (a > TARGET_5) {
        badge.className = 'tbadge done';
        badge.textContent = '✅ 5';
      } else if (a >= TARGET_4) {
        const need5 = needGrades(subj.grades, TARGET_5);
        badge.className = 'tbadge to5';
        badge.textContent = 'нужно ' + need5 + ' п. → 5';
      } else {
        const need4 = needGrades(subj.grades, TARGET_4);
        badge.className = 'tbadge to4';
        badge.textContent = 'нужно ' + need4 + ' п. → 4';
      }
    }
    item.appendChild(badge);
    list.appendChild(item);
  });
}

// ===== СВОДКА =====
function updateSummary() {
  let c5 = 0, c4 = 0, c3 = 0, c2 = 0, c0 = 0;
  subjects.forEach(s => {
    const st = getSubjectStatus(s);
    if (st === 'empty') c0++;
    else if (st === 'five') c5++;
    else if (st === 'four') c4++;
    else if (st === 'three') c3++;
    else if (st === 'two') c2++;
  });

  document.getElementById('top5').textContent = c5;
  document.getElementById('top4').textContent = c4;
  document.getElementById('top3').textContent = c3;
  document.getElementById('top2').textContent = c2 + c0;

  document.getElementById('stat5').textContent = '🟢 На 5: ' + c5;
  document.getElementById('stat4').textContent = '🔵 На 4: ' + c4;
  document.getElementById('stat3').textContent = '🟡 На 3: ' + c3;
  document.getElementById('statEmpty').textContent = '⚪ На 2 или без оценок: ' + (c2 + c0);
  document.getElementById('statTotal').textContent = '📌 Всего ' + subjects.length + ' ' + plural(subjects.length);

  document.getElementById('headerSub').textContent =
    'Цель: средний > 4.6 — пятёрка в четверти · ' + subjects.length + ' ' + plural(subjects.length);

  const alertBar = document.getElementById('alertBar');
  if (c2 > 0) {
    alertBar.className = 'alert-bar danger show';
    alertBar.innerHTML = '🚨 <strong>ТРЕВОГА!</strong> У тебя ' + c2 + ' ' + plural(c2) + ' на 2. Срочно исправляй!';
  } else if (c3 > 0) {
    alertBar.className = 'alert-bar warn show';
    alertBar.innerHTML = '⚠️ <strong>ВНИМАНИЕ.</strong> У тебя ' + c3 + ' ' + plural(c3) + ' на 3. Нужно подтянуть!';
  } else {
    alertBar.className = 'alert-bar';
    alertBar.innerHTML = '';
  }
}

// ===== СБРОС =====
function resetAll() {
  if (confirm('Точно сбросить все оценки?')) {
    localStorage.removeItem('grades10_lyoha');
    location.reload();
  }
}

// ===== СТАРТ =====
load();
render();

// ===== ИНТЕРАКТИВНЫЙ 3D-ДОМИК =====
(function() {
  const house = document.getElementById('house3d');
  if (!house) return;

  let rotX = -15, rotY = -25;
  let velX = 0.15, velY = 0.4;
  let isDragging = false;
  let lastX = 0, lastY = 0;
  const isMobile = window.innerWidth <= 620;
  const scale = isMobile ? 0.85 : 1;

  function update() {
    if (!isDragging) {
      rotY += velY;
      rotX += velX;
      velX *= 0.996;
      velY *= 0.996;
      if (Math.abs(velX) < 0.1) velX = velX > 0 ? 0.1 : -0.1;
      if (Math.abs(velY) < 0.2) velY = velY > 0 ? 0.2 : -0.2;
    }
    const s = isMobile ? ' scale(' + scale + ')' : '';
    house.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)' + s;
    requestAnimationFrame(update);
  }

  function startDrag(e) {
    isDragging = true;
    const p = e.touches ? e.touches[0] : e;
    lastX = p.clientX;
    lastY = p.clientY;
  }

  function moveDrag(e) {
    if (!isDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - lastX;
    const dy = p.clientY - lastY;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    if (rotX > 30) rotX = 30;
    if (rotX < -60) rotX = -60;
    velY = dx * 0.12;
    velX = -dy * 0.12;
    lastX = p.clientX;
    lastY = p.clientY;
    e.preventDefault();
  }

  function endDrag() {
    isDragging = false;
  }

  house.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  house.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('touchend', endDrag);

  update();
})();
</script>
</body>
</html>
